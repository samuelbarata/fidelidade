[package]
name = "fidelidade"
version = "0.1.1"
edition = "2024"
description = "Unofficial read-only client for the Fidelidade (Portuguese insurer) customer area: policies and downloadable documents"
keywords = ["fidelidade", "insurance", "portugal", "documents", "scraper"]
categories = ["api-bindings", "web-programming::http-client"]
license = "MIT-0"
repository = "https://github.com/samuelbarata/fidelidade"
readme = "README.md"
# Highest `rust-version` declared by a dependency (time, cookie_store); enforced by
# the MSRV job in .github/workflows/ci.yml.
rust-version = "1.88"
# Keep CI config, local session files and the test suite (its fixtures are synthetic
# pages in the shapes the parsers match) out of the published package.
exclude = [
    ".github/",
    ".gitlab-ci.yml",
    "renovate.json",
    ".fidelidade-session.json",
    ".env",
    ".env.example",
    "tests/",
]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
cookie = "0.18"
cookie_store = { version = "0.22", features = ["serde_json"] }
regex = "1.13.1"
reqwest = { version = "0.13", features = ["cookies", "form"] }
scraper = "0.29"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
tracing = "0.1.44"
url = { version = "2.5.8", features = ["serde"] }

[dev-dependencies]
dotenvy = "0.15"
rpassword = "7"
tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wiremock = "0.6"
